<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>InhoDrama · 设置服务器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2230 0%, #0f1115 55%);
    color: #e6e8eb;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 420px; max-width: 90vw;
    background: rgba(30, 36, 48, 0.75);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 36px 32px;
    backdrop-filter: blur(16px);
  }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
  .sub { color: #9aa4b2; font-size: 13px; margin-bottom: 28px; }
  label { font-size: 12px; color: #9aa4b2; display: block; margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(10,12,16,0.6);
    color: #fff; font-size: 15px; outline: none;
    margin-bottom: 18px;
  }
  input:focus { border-color: #4c8dff; }
  button {
    width: 100%; padding: 13px;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .err { color: #f87171; font-size: 13px; margin-top: 14px; min-height: 18px; }
  .hint { color: #6b7686; font-size: 12px; margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <h1>InhoDrama</h1>
    <div class="sub">NAS 短剧系统 · 桌面客户端</div>
    <label>服务器地址</label>
    <input id="url" placeholder="http://192.168.31.31:8654" spellcheck="false" autocomplete="off">
    <button id="connect">连接</button>
    <div id="err" class="err"></div>
    <div class="hint">请输入你部署 InhoDrama 的 NAS 服务地址（含端口），即可打开短剧库。</div>
  </div>
  <script>
    window.inho.getServerUrl().then(function (u) {
      if (u) document.getElementById('url').value = u
    })
    function doConnect() {
      var url = document.getElementById('url').value.trim()
      var err = document.getElementById('err')
      if (!url) { err.textContent = '请输入服务器地址'; return }
      window.inho.connect(url).then(function (res) {
        if (res && res.ok === false) err.textContent = res.error || '连接失败'
      }).catch(function (e) { err.textContent = String(e && e.message || e) })
    }
    document.getElementById('connect').addEventListener('click', doConnect)
    document.getElementById('url').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doConnect()
    })
  </script>
</body>
</html>
